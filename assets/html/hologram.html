<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>body{margin:0;overflow:hidden;background:black;}</style>
</head>
<body>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.128.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x050510);
const camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
camera.position.set(0,1.5,5);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);
const geo=new THREE.TorusKnotGeometry(0.9,0.28,128,16,3,4);
const mat=new THREE.ShaderMaterial({uniforms:{time:{value:0}},vertexShader:`varying vec3 vPosition;void main(){vPosition=position;gl_PointSize=1.0;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,fragmentShader:`uniform float time;varying vec3 vPosition;void main(){float r=sin(vPosition.x*2.0+time)*0.8+0.5;float g=cos(vPosition.y*2.0+time*1.3)*0.8+0.5;float b=sin((vPosition.x+vPosition.y)*2.0+time*0.7)*0.8+0.5;gl_FragColor=vec4(r,g,b,0.95);}`,transparent:true,side:THREE.DoubleSide});
const knot=new THREE.Mesh(geo,mat); scene.add(knot);
const pcount=2000; const pgeo=new THREE.BufferGeometry(); const pos=new Float32Array(pcount*3);
for(let i=0;i<pcount;i++){pos[i*3]=(Math.random()-0.5)*10;pos[i*3+1]=(Math.random()-0.5)*8;pos[i*3+2]=(Math.random()-0.5)*10-5;}
pgeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
const pts=new THREE.Points(pgeo,new THREE.PointsMaterial({color:0x88aaff,size:0.05,transparent:true,opacity:0.6}));
scene.add(pts);
const al=new THREE.AmbientLight(0x404060); scene.add(al);
const dl=new THREE.DirectionalLight(0xffffff,0.5); dl.position.set(1,2,1); scene.add(dl);
let clock=new THREE.Clock();
function animate(){let t=clock.getElapsedTime(); mat.uniforms.time.value=t; knot.rotation.x=t*0.2; knot.rotation.y=t*0.3; pts.rotation.y=t*0.05; renderer.render(scene,camera); requestAnimationFrame(animate);}
animate();
window.setRotation=function(x,y){knot.rotation.x+=x; knot.rotation.y+=y;};
window.getRotation=function(){return{x:knot.rotation.x,y:knot.rotation.y};};
</script>
</body>
</html>
