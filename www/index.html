<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DRAFTED BY KINGS – ACE SOVEREIGN OS</title>
    <style>
        /* (paste the complete CSS from the final version) */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; background: black; color: white; }
        canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .top-bar { position: absolute; top: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 20; pointer-events: auto; border-bottom: 1px solid rgba(255,255,255,0.3); font-size: 12px; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo { height: 40px; width: 120px; background-size: contain; background-repeat: no-repeat; background-color: #222; border-radius: 8px; }
        .system-status { display: flex; gap: 16px; background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 20px; font-family: monospace; }
        .browser-chat { position: absolute; bottom: 100px; left: 20px; right: 20px; max-width: 550px; background: rgba(0,0,0,0.65); backdrop-filter: blur(16px); border-radius: 16px; border: 1px solid rgba(0,255,255,0.3); pointer-events: auto; z-index: 25; display: flex; flex-direction: column; }
        .chat-tab-bar { display: flex; border-bottom: 1px solid rgba(0,255,255,0.3); background: rgba(0,0,0,0.5); border-radius: 16px 16px 0 0; }
        .chat-tab { padding: 10px 16px; cursor: pointer; background: transparent; border: none; color: white; font-size: 14px; font-weight: bold; }
        .chat-tab.active { background: rgba(0,255,255,0.2); border-bottom: 2px solid cyan; }
        .address-bar { display: flex; padding: 8px; gap: 8px; background: rgba(0,0,0,0.4); }
        .address-input { flex: 1; background: rgba(255,255,255,0.15); border: 1px solid cyan; border-radius: 20px; padding: 8px 12px; color: white; }
        .go-btn { background: #1e90ff; border: none; border-radius: 20px; padding: 8px 16px; cursor: pointer; }
        .chat-content { height: 260px; overflow-y: auto; padding: 12px; font-size: 14px; display: flex; flex-direction: column; gap: 8px; }
        .message { padding: 8px 12px; border-radius: 18px; max-width: 85%; }
        .user-message { align-self: flex-end; background: #1e90ff; }
        .assistant-message { align-self: flex-start; background: rgba(255,255,255,0.2); }
        .chat-input-row { display: flex; padding: 8px; gap: 8px; border-top: 1px solid rgba(0,255,255,0.3); }
        .chat-input-row input { flex: 1; background: rgba(0,0,0,0.6); border: 1px solid cyan; border-radius: 20px; padding: 8px; color: white; }
        .chat-input-row button { background: #1e90ff; border: none; border-radius: 20px; padding: 8px 16px; cursor: pointer; }
        .launcher-btn { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); border-radius: 40px; padding: 10px 18px; cursor: pointer; pointer-events: auto; font-size: 14px; z-index: 30; border: 1px solid cyan; }
        .launcher-menu { position: absolute; bottom: 80px; left: 20px; background: rgba(0,0,0,0.9); backdrop-filter: blur(20px); border-radius: 20px; padding: 12px; display: none; grid-template-columns: repeat(2, 100px); gap: 10px; pointer-events: auto; z-index: 30; border: 1px solid cyan; }
        .launcher-menu button { background: #2a2a3a; border: none; color: white; padding: 8px; border-radius: 12px; cursor: pointer; font-size: 12px; }
        .app-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); backdrop-filter: blur(20px); z-index: 40; display: none; flex-direction: column; pointer-events: auto; }
        .app-modal.active { display: flex; }
        .app-modal-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(0,0,0,0.8); border-bottom: 1px solid cyan; }
        .close-modal { background: #ff4757; border: none; color: white; padding: 6px 12px; border-radius: 20px; cursor: pointer; }
        .app-frame { flex: 1; width: 100%; border: none; background: white; }
        #motionVideo { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.15; pointer-events: none; z-index: 1; }
    </style>
</head>
<body>
    <video id="motionVideo" autoplay playsinline muted></video>
    <div id="ui">
        <div class="top-bar">
            <div class="logo-area">
                <div class="logo" style="background-image: url('assets/branding_drafted_kings.jpg');"></div>
                <div class="logo" style="background-image: url('assets/branding_dbk.png'); width: 60px;"></div>
            </div>
            <div class="system-status">
                <div><span style="color:#88aaff;">GOD MODE:</span> <span style="color:#ff5555;">OFF</span></div>
                <div><span style="color:#88aaff;">SECURE SYNC:</span> <span style="color:#0f0;">ACTIVE</span></div>
                <div><span style="color:#88aaff;">QUANTUM MESH:</span> <span style="color:#0f0;">STABLE</span></div>
                <div><span style="color:#88aaff;">HEARTBEAT:</span> <span style="color:#0f0;">ONLINE</span></div>
                <div><span style="color:#88aaff;">UPTIME:</span> <span style="color:#0f0;">33 DAYS</span></div>
            </div>
        </div>
        <div class="launcher-btn" id="launcherBtn">☰ ACE COMMAND</div>
        <div class="launcher-menu" id="launcherMenu">
            <button data-app="trav">👑 Trav</button>
            <button data-app="ace">🛡️ ACE</button>
            <button data-app="warroom">⚔️ War Room</button>
            <button data-app="game">🎮 Game</button>
            <button data-app="arena">🏟️ Arena</button>
            <button data-app="camera">📷 Camera</button>
            <button data-app="maps">🗺️ Maps</button>
            <button data-app="dbk">💰 DBK</button>
        </div>
        <div class="browser-chat" id="browserChat">
            <div class="chat-tab-bar">
                <button class="chat-tab active" data-tab="chat">💬 QUANTUM CHAT</button>
                <button class="chat-tab" data-tab="browser">🌐 BROWSER</button>
                <button class="chat-tab" data-tab="game">🎮 GAME</button>
            </div>
            <div class="address-bar" id="addressBar" style="display: none;">
                <input class="address-input" id="urlInput" placeholder="Enter URL or search...">
                <button class="go-btn" id="goUrl">GO</button>
            </div>
            <div class="chat-content" id="chatContent">
                <div class="message assistant-message">⚡ ACE COMMAND / QUANTUM CHAT active. GLO-BO online.</div>
                <div class="message assistant-message">Ask me anything or say "open War Room".</div>
            </div>
            <div class="chat-input-row" id="chatInputRow">
                <input type="text" id="chatInput" placeholder="Message GLO-BO...">
                <button id="sendChat">SEND</button>
            </div>
        </div>
    </div>
    <div id="appModal" class="app-modal">
        <div class="app-modal-header"><span class="modal-title" id="modalTitle">App</span><button class="close-modal" id="closeModal">✕ CLOSE</button></div>
        <iframe id="modalFrame" class="app-frame" allow="camera; microphone; geolocation"></iframe>
    </div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "@mediapipe/hands": "https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { Hands, Camera } from '@mediapipe/hands';
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        const camera3d = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera3d.position.set(0, 1.5, 5);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        const geometry = new THREE.TorusKnotGeometry(0.9, 0.28, 128, 16, 3, 4);
        const material = new THREE.ShaderMaterial({
            uniforms: { time: { value: 0 } },
            vertexShader: `varying vec3 vPosition; void main() { vPosition = position; gl_PointSize = 1.0; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
            fragmentShader: `uniform float time; varying vec3 vPosition; void main() { float r = sin(vPosition.x * 2.0 + time) * 0.8 + 0.5; float g = cos(vPosition.y * 2.0 + time * 1.3) * 0.8 + 0.5; float b = sin((vPosition.x + vPosition.y) * 2.0 + time * 0.7) * 0.8 + 0.5; gl_FragColor = vec4(r, g, b, 0.95); }`,
            transparent: true, side: THREE.DoubleSide
        });
        const knot = new THREE.Mesh(geometry, material);
        scene.add(knot);
        const particleCount = 2000;
        const particlesGeom = new THREE.BufferGeometry();
        const posArray = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) { posArray[i*3] = (Math.random() - 0.5) * 12; posArray[i*3+1] = (Math.random() - 0.5) * 8; posArray[i*3+2] = (Math.random() - 0.5) * 12 - 5; }
        particlesGeom.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMat = new THREE.PointsMaterial({ color: 0x88aaff, size: 0.05, transparent: true });
        const particles = new THREE.Points(particlesGeom, particlesMat);
        scene.add(particles);
        const ambient = new THREE.AmbientLight(0x404060);
        scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(1, 2, 1);
        scene.add(dirLight);
        let clock = new THREE.Clock();
        function animate() {
            const t = clock.getElapsedTime();
            material.uniforms.time.value = t;
            knot.rotation.x = t * 0.2;
            knot.rotation.y = t * 0.3;
            particles.rotation.y = t * 0.05;
            renderer.render(scene, camera3d);
            requestAnimationFrame(animate);
        }
        animate();
        const videoEl = document.getElementById('motionVideo');
        async function initMotion() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                videoEl.srcObject = stream;
                await videoEl.play();
                const hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
                hands.setOptions({ maxNumHands: 1, modelComplexity: 1 });
                hands.onResults((results) => {
                    if (results.multiHandLandmarks?.length) {
                        const lm = results.multiHandLandmarks[0];
                        const palmX = (lm[0].x - 0.5) * 2;
                        const palmY = (lm[0].y - 0.5) * 2;
                        knot.rotation.x += palmY * 0.02;
                        knot.rotation.y += palmX * 0.02;
                    }
                });
                const camera = new Camera(videoEl, { onFrame: async () => await hands.send({ image: videoEl }), width: 1280, height: 720 });
                camera.start();
            } catch(e) { console.warn(e); }
        }
        initMotion();
        // Chat logic
        const chatMessagesDiv = document.getElementById('chatContent');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendChat');
        function addMessage(role, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role === 'user' ? 'user-message' : 'assistant-message'}`;
            msgDiv.innerText = text;
            chatMessagesDiv.appendChild(msgDiv);
            chatMessagesDiv.scrollTop = chatMessagesDiv.scrollHeight;
        }
        async function callGlobo(prompt) {
            try {
                const res = await fetch('http://localhost:11434/api/generate', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: 'llama3', prompt, stream: false })
                });
                const data = await res.json();
                return data.response;
            } catch(e) { return "⚡ GLO-BO: Local AI offline."; }
        }
        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;
            addMessage('user', text);
            chatInput.value = '';
            const lower = text.toLowerCase();
            if (lower.includes('open war room')) openApp('warroom');
            else if (lower.includes('open arena')) openApp('arena');
            else if (lower.includes('open camera')) openApp('camera');
            else if (lower.includes('open maps')) openApp('maps');
            else if (lower.includes('open dbk')) openApp('dbk');
            else {
                const reply = await callGlobo(text);
                addMessage('assistant', reply);
            }
        }
        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
        // Tabs
        const tabs = document.querySelectorAll('.chat-tab');
        const addressBar = document.getElementById('addressBar');
        const chatInputRow = document.getElementById('chatInputRow');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                const mode = tab.getAttribute('data-tab');
                if (mode === 'browser') {
                    addressBar.style.display = 'flex';
                    chatInputRow.style.display = 'none';
                    chatMessagesDiv.innerHTML = '<iframe id="browserFrame" src="https://duckduckgo.com" style="width:100%; height:100%; border:none;"></iframe>';
                } else if (mode === 'game') {
                    addressBar.style.display = 'none';
                    chatInputRow.style.display = 'flex';
                    chatMessagesDiv.innerHTML = '<div style="text-align:center; padding:20px;">🎮 Game mode (coming soon)</div>';
                } else {
                    addressBar.style.display = 'none';
                    chatInputRow.style.display = 'flex';
                    chatMessagesDiv.innerHTML = '<div>Quantum Chat ready.</div>';
                }
            });
        });
        document.getElementById('goUrl')?.addEventListener('click', () => {
            const url = document.getElementById('urlInput').value;
            if (url && document.getElementById('browserFrame')) document.getElementById('browserFrame').src = url.startsWith('http') ? url : 'https://' + url;
        });
        // App modal launcher
        const modal = document.getElementById('appModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalFrame = document.getElementById('modalFrame');
        const closeModal = document.getElementById('closeModal');
        const launcherBtn = document.getElementById('launcherBtn');
        const launcherMenu = document.getElementById('launcherMenu');
        function openApp(appId) {
            let title = appId.charAt(0).toUpperCase() + appId.slice(1);
            let url = 'about:blank';
            if (appId === 'trav') url = 'about:blank';
            else if (appId === 'ace') url = 'about:blank';
            else if (appId === 'warroom') url = 'about:blank';
            else if (appId === 'arena') url = 'about:blank';
            else if (appId === 'camera') url = 'camera://';
            else if (appId === 'maps') url = 'https://www.openstreetmap.org'\;
            else if (appId === 'dbk') url = 'about:blank';
            modalTitle.innerText = title;
            modalFrame.src = url;
            modal.classList.add('active');
            launcherMenu.style.display = 'none';
        }
        closeModal.addEventListener('click', () => modal.classList.remove('active'));
        document.querySelectorAll('.launcher-menu button').forEach(btn => {
            btn.addEventListener('click', () => openApp(btn.getAttribute('data-app')));
        });
        launcherBtn.addEventListener('click', () => {
            launcherMenu.style.display = launcherMenu.style.display === 'grid' ? 'none' : 'grid';
        });
        document.addEventListener('click', (e) => {
            if (!launcherBtn.contains(e.target) && !launcherMenu.contains(e.target)) launcherMenu.style.display = 'none';
        });
        window.addEventListener('resize', () => {
            camera3d.aspect = window.innerWidth / window.innerHeight;
            camera3d.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        console.log("DRAFTED BY KINGS – ACE SOVEREIGN OS READY");
    </script>
</body>
</html>
